# Standalone Nginx Configuration for Person B (Mac 2)
# Reverse Proxy and Round-Robin Load Balancer with TLS termination

worker_processes 1;
error_log logs/error.log info;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /opt/homebrew/etc/nginx/mime.types;
    default_type  application/json;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$upstream_addr" "$upstream_response_time"';

    access_log logs/access.log main;

    sendfile        on;
    keepalive_timeout  65;

    # Task D: Upstream Load Balancer pool (Round-Robin by default)
    # When deployed to physical Macs, change 127.0.0.1 to Person C & Person D IP addresses.
    upstream backend_pool {
        server 127.0.0.1:3001 max_fails=3 fail_timeout=5s;
        server 10.7.17.147:3002 max_fails=3 fail_timeout=5s;
    }

    # HTTP Edge Entrypoint (Port 8080)
    server {
        listen 8080;
        server_name localhost app.teamX.test api.teamX.test;

        location / {
            proxy_pass http://backend_pool;
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Ensure custom backend tracking header is forwarded
            proxy_pass_header X-Backend;

            # Support HTTP Caching (Task F)
            proxy_pass_header Cache-Control;
            proxy_pass_header ETag;

            proxy_buffering off;
        }
    }

    # HTTPS Edge Entrypoint (Port 8443 - Task E: TLS Termination)
    server {
        listen 8443 ssl;
        server_name localhost app.teamX.test api.teamX.test;

        ssl_certificate     ../tls/server.crt;
        ssl_certificate_key ../tls/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://backend_pool;
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass_header X-Backend;
            proxy_pass_header Cache-Control;
            proxy_pass_header ETag;

            proxy_buffering off;
        }
    }
}
