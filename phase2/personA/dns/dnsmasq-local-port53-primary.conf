# phase2/personA/dns/dnsmasq-local-port53-primary.conf
# 1-Mac sudo Primary DNS (127.0.0.1:53)
listen-address=127.0.0.1
port=53
bind-interfaces
no-hosts
no-resolv

local=/app.teamX.test/
local=/api.teamX.test/

local-ttl=30
host-record=app.teamX.test,127.0.0.1,30
host-record=api.teamX.test,127.0.0.1,30

server=8.8.8.8
log-queries
log-facility=/tmp/dnsmasq-p53-primary.log
