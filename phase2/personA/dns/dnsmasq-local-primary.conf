# phase2/personA/dns/dnsmasq-local-primary.conf
# 1-Mac non-sudo Primary DNS (Port 15353)
listen-address=127.0.0.1
port=15353
bind-interfaces
no-hosts
no-resolv

local=/app.teamX.test/
local=/api.teamX.test/

local-ttl=30
host-record=app.teamX.test,127.0.0.1,30
host-record=api.teamX.test,127.0.0.1,30

log-queries
log-facility=/tmp/dnsmasq-local-primary.log
