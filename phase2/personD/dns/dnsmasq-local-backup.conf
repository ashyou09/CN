# phase2/personD/dns/dnsmasq-local-backup.conf
# 1-Mac non-sudo Backup DNS (Port 15354)
listen-address=127.0.0.1
port=15354
bind-interfaces
no-hosts
no-resolv

local=/app.teamX.test/
local=/api.teamX.test/

local-ttl=30
host-record=app.teamX.test,127.0.0.1,30
host-record=api.teamX.test,127.0.0.1,30

log-queries
log-facility=/tmp/dnsmasq-local-backup.log
