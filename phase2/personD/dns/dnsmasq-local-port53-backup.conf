# phase2/personD/dns/dnsmasq-local-port53-backup.conf
# 1-Mac sudo Backup DNS (127.0.0.2:53)
listen-address=127.0.0.2
port=53
bind-interfaces
no-hosts
no-resolv

local=/app.teamX.test/
local=/api.teamX.test/

local-ttl=30
host-record=app.teamX.test,127.0.0.1,30
host-record=api.teamX.test,127.0.0.1,30

server=8.8.8.8
log-queries
log-facility=/tmp/dnsmasq-p53-backup.log
