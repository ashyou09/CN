# dnsmasq.conf - Private DNS Configuration for Person A (Mac 1)
# Resolves .test domain names to Mac 2 (Edge Nginx IP)

# Listen on all interfaces (LAN accessible)
listen-address=0.0.0.0
bind-interfaces

# Do not forward plain names without a dot or domain part
domain-needed
bogus-priv

# Only serve project queries, don't read /etc/hosts if unwanted
no-hosts

# Define Team Project Records:
# Keep both private names local, including AAAA and other non-A queries.
local=/app.teamX.test/
local=/api.teamX.test/
address=/app.teamX.test/10.7.3.128
address=/api.teamX.test/10.7.3.128

# Upstream public DNS fallback for non-local domains (Google DNS)
# Do not import macOS resolv.conf: Mac 1 uses this server and would forward to itself.
no-resolv
server=8.8.8.8
server=8.8.4.4

# Log all DNS queries for debugging & Wireshark observation
log-queries
log-facility=/tmp/dnsmasq.log
